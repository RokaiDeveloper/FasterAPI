name: Bug report
description: Report a reproducible problem in FasterAPI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use GitHub Security Advisories instead.

  - type: input
    id: fasterapi-version
    attributes:
      label: FasterAPI version
      description: Which FasterAPI version are you using?
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "17 or 21"
    validations:
      required: true

  - type: input
    id: spring-boot-version
    attributes:
      label: Spring Boot version
      placeholder: "3.2.5"
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: "PostgreSQL 16, H2 2.2, or not applicable"

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a minimal code sample or a link to a public repository.
      placeholder: Describe the smallest example that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the complete relevant stack trace, without secrets.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed credentials, private keys, tokens, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
