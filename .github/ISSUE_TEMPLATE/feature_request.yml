name: Feature request
description: Suggest an improvement or new feature for FasterAPI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem or use case would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds have you tried?

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Explain possible effects on existing APIs, Java 17 support, or Spring Boot integration.

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues before opening this request.
          required: true
        - label: This request does not disclose a security vulnerability.
          required: true
