name: Question or support
description: Ask a usage question or request help with FasterAPI.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        For general design discussions and longer conversations, consider using GitHub Discussions.
        Do not report security vulnerabilities here. Use GitHub Security Advisories instead.

  - type: input
    id: fasterapi-version
    attributes:
      label: FasterAPI version
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "17 or 21"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain what you are trying to do and include relevant configuration or code.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant errors or logs, without secrets.

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: I removed credentials, private keys, tokens, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
