name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to release, for example 1.0.2"
        required: true
        type: string

  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release pull request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate and prepare release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version"
            echo "Expected format: MAJOR.MINOR.PATCH"
            exit 1
          fi

          git fetch origin main --tags
          git checkout -B main origin/main

          if git ls-remote --exit-code origin \
            "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Remote tag v$version already exists."
            echo "Refusing to prepare a duplicate release."
            exit 1
          fi

          current_version="$(./mvnw help:evaluate \
            -Dexpression=project.version \
            -q -DforceStdout)"

          if [ "$current_version" = "$version" ]; then
            echo "main already contains version $version."
            echo "Check whether this release has already been merged."
            exit 1
          fi

          branch="release/v${version}-retry-${GITHUB_RUN_ID}"

          ./mvnw -B versions:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false

          ./mvnw -B versions:commit

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch" origin/main
          git add pom.xml

          if git diff --cached --quiet; then
            echo "No POM changes found."
            exit 1
          fi

          git commit -m "chore(release): prepare v$version"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): prepare v$version" \
            --body "Release preparation for FasterAPI v$version.

          This pull request prepares the Maven project version. Merge only after the required checks pass. Merging triggers the Maven Central publication workflow."

  publish:
    name: Publish to Maven Central
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Java and Maven Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: 18DCB6FACEDA64D63CA1283F9EA33AFF7D208084

      - name: Validate release and remote tag
        id: release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail

          version="$(./mvnw help:evaluate \
            -Dexpression=project.version \
            -q -DforceStdout)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release version in POM: $version"
            exit 1
          fi

          if git ls-remote --exit-code origin \
            "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Remote tag v$version already exists."
            echo "Refusing to publish a potentially duplicate release."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing publication of FasterAPI $version"

      - name: Test and publish release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail

          ./mvnw -B clean deploy -Prelease \
            -Dgpg.keyname=18DCB6FACEDA64D63CA1283F9EA33AFF7D208084

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"

          git fetch origin --tags

          if git ls-remote --exit-code origin \
            "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Remote tag v$version appeared during publication."
            echo "Inspect the remote state before proceeding."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "v$version" -m "Release v$version"
          git push origin "refs/tags/v$version"
